<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="780" fill="url(#bg)"/>
  <rect width="1400" height="780" fill="url(#grid)"/>
  <circle cx="1180" cy="120" r="260" fill="#34d399" opacity="0.045"/>
  <circle cx="160" cy="680" r="240" fill="#38bdf8" opacity="0.04"/>

  <text x="56" y="62" fill="#34d399" font-size="13" font-weight="700" letter-spacing="3">ARCHITECTURE</text>
  <text x="56" y="106" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="-0.5">一条链路：评分 → 改写 → 复评分</text>
  <text x="56" y="136" fill="#94a3b8" font-size="15">规则引擎负责可解释评分，LLM 只负责改写；改写结果必须过质量闸门。</text>

  <!-- Entry group -->
  <rect x="40" y="178" width="320" height="430" rx="18" fill="#0f172a" fill-opacity="0.72" stroke="#24324a"/>
  <text x="64" y="210" fill="#64748b" font-size="12" font-weight="700" letter-spacing="2">ENTRY</text>
  <g filter="url(#soft)">
    <rect x="68" y="232" width="264" height="82" rx="12" fill="#111c2f" stroke="#2b3b55"/>
    <rect x="68" y="338" width="264" height="82" rx="12" fill="#111c2f" stroke="#2b3b55"/>
    <rect x="68" y="444" width="264" height="82" rx="12" fill="#111c2f" stroke="#2b3b55"/>
  </g>
  <text x="88" y="264" fill="#e2e8f0" font-size="17" font-weight="700">Next.js 16 Web</text>
  <text x="88" y="288" fill="#7c8ca6" font-size="12">编辑器 · 高亮 · Diff · 批量</text>
  <text x="88" y="370" fill="#e2e8f0" font-size="17" font-weight="700">REST API /api/v1</text>
  <text x="88" y="394" fill="#7c8ca6" font-size="12">OpenAPI · SSE · 限流</text>
  <text x="88" y="476" fill="#e2e8f0" font-size="17" font-weight="700">CLI · Typer</text>
  <text x="88" y="500" fill="#7c8ca6" font-size="12">analyze · batch · lex · doctor</text>

  <!-- Core group -->
  <rect x="432" y="178" width="536" height="430" rx="18" fill="#0f172a" fill-opacity="0.72" stroke="#24324a"/>
  <text x="456" y="210" fill="#64748b" font-size="12" font-weight="700" letter-spacing="2">CORE ENGINE</text>
  <g filter="url(#soft)">
    <rect x="460" y="232" width="480" height="92" rx="12" fill="#10251f" stroke="#1f6f58"/>
    <rect x="460" y="350" width="480" height="92" rx="12" fill="#111c2f" stroke="#2b3b55"/>
    <rect x="460" y="468" width="480" height="92" rx="12" fill="#111c2f" stroke="#2b3b55"/>
  </g>
  <text x="482" y="264" fill="#d1fae5" font-size="17" font-weight="700">评分引擎 · 8 维</text>
  <text x="482" y="288" fill="#6ee7b7" font-size="12">套话 / 句长 / 连接词 / 名词化 / 结构 / 模板 / 空泛 / 个性化</text>
  <text x="482" y="309" fill="#64748b" font-size="11">961 条中英词库 · 7 类文体权重 · 纯本地毫秒级</text>
  <text x="482" y="382" fill="#e2e8f0" font-size="17" font-weight="700">改写管线</text>
  <text x="482" y="406" fill="#7c8ca6" font-size="12">5 种风格并行 · SSE 流式 · 事实锚点注入</text>
  <text x="482" y="500" fill="#e2e8f0" font-size="17" font-weight="700">质量闸门</text>
  <text x="482" y="524" fill="#7c8ca6" font-size="12">事实召回 · 字数比 · 分数下降 · 不达标自动重试</text>

  <!-- Providers group -->
  <rect x="1040" y="178" width="320" height="430" rx="18" fill="#0f172a" fill-opacity="0.72" stroke="#24324a"/>
  <text x="1064" y="210" fill="#64748b" font-size="12" font-weight="700" letter-spacing="2">MODEL PROVIDERS</text>
  <g filter="url(#soft)">
    <rect x="1068" y="232" width="264" height="78" rx="12" fill="#111c2f" stroke="#2b3b55"/>
    <rect x="1068" y="336" width="264" height="78" rx="12" fill="#111c2f" stroke="#2b3b55"/>
    <rect x="1068" y="440" width="264" height="78" rx="12" fill="#111c2f" stroke="#2b3b55"/>
  </g>
  <text x="1088" y="263" fill="#e2e8f0" font-size="16" font-weight="700">OpenAI 兼容</text>
  <text x="1088" y="286" fill="#7c8ca6" font-size="12">10 个供应商预设</text>
  <text x="1088" y="367" fill="#e2e8f0" font-size="16" font-weight="700">Anthropic</text>
  <text x="1088" y="390" fill="#7c8ca6" font-size="12">Messages API</text>
  <text x="1088" y="471" fill="#e2e8f0" font-size="16" font-weight="700">Ollama</text>
  <text x="1088" y="494" fill="#7c8ca6" font-size="12">本地模型</text>
  <text x="1068" y="556" fill="#64748b" font-size="12">密钥 Fernet 加密 · 默认不落原文</text>

  <!-- Storage strip -->
  <rect x="432" y="650" width="928" height="86" rx="14" fill="#0f172a" fill-opacity="0.72" stroke="#24324a"/>
  <text x="456" y="680" fill="#64748b" font-size="12" font-weight="700" letter-spacing="2">STORAGE</text>
  <text x="456" y="708" fill="#cbd5e1" font-size="14">PostgreSQL 15 / SQLite · 历史仅存 hash + 分数</text>
  <text x="836" y="708" fill="#cbd5e1" font-size="14">批量队列 · 进程内</text>
  <text x="1088" y="708" fill="#cbd5e1" font-size="14">Redis 7 · 健康检查</text>

  <!-- Entry -> Core bus -->
  <path d="M 332 398 H 400 V 278 H 460" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 400 398 V 396 H 460" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 400 398 V 514 H 460" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="338" y="388" fill="#64748b" font-size="11">HTTP / CLI</text>

  <!-- Core internal -->
  <path d="M 700 324 V 350" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 700 442 V 468" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 940 514 H 966 V 278 H 940" fill="none" stroke="#34d399" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowGreen)"/>
  <text x="744" y="342" fill="#34d399" font-size="11">命中 / 建议</text>
  <text x="744" y="460" fill="#34d399" font-size="11">候选 / 复评分</text>
  <text x="900" y="262" fill="#34d399" font-size="11">Δ 反馈</text>

  <!-- Core -> Providers -->
  <path d="M 940 396 H 1000 V 271 H 1068" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 1000 396 H 1068" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 1000 396 V 479 H 1068" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="944" y="386" fill="#64748b" font-size="11">LLM 调用</text>

  <!-- Persistence -->
  <path d="M 700 608 V 650" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="712" y="636" fill="#64748b" font-size="11">持久化 / 审计</text>

  <!-- Legend -->
  <line x1="1068" y1="612" x2="1100" y2="612" stroke="#34d399" stroke-width="2"/>
  <text x="1108" y="616" fill="#64748b" font-size="11">评分反馈</text>
  <line x1="1180" y1="612" x2="1212" y2="612" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 5"/>
  <text x="1220" y="616" fill="#64748b" font-size="11">存储 / 外部调用</text>
</svg>
