name: docker

# 镜像发布策略：
#   - push 到 main / 打 v* tag → 构建并推送到 GHCR
#   - PR → 只构建不推送（验证 Dockerfile 没坏）
#   - 手动触发（workflow_dispatch）→ 构建并推送
#
# 镜像名：ghcr.io/<owner>/de-ai-ify-api 与 ghcr.io/<owner>/de-ai-ify-web
# 镜像名统一小写（GHCR 要求），owner 用仓库 owner 的小写形式。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            build_args: ""
          - name: web
            dockerfile: docker/Dockerfile.web
            # web 的 rewrites 目标在构建期固化，必须在这里传
            build_args: "API_PROXY_TARGET=http://api:8000"
    steps:
      - uses: actions/checkout@v4

      # QEMU 让 amd64 runner 也能构建 arm64（Apple Silicon / ARM 服务器）
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # PR 来自 fork 时 secrets 不可用，跳过登录只做构建验证
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: meta
        run: |
          # GHCR 要求全小写，仓库名可能含大写
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${owner}/de-ai-ify-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          # latest 只跟 main；tag 推 v1.2.3 时同时打 1.2.3 / 1.2 / latest
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=de-ai-ify ${{ matrix.name }}
            org.opencontainers.image.description=可解释的 AI 味评分与改写（${{ matrix.name }} 镜像）
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # PR 只构建 amd64（快）；推送到 registry 时出多架构
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: ${{ matrix.build_args }}
