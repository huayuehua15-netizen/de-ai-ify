name: ci

on:
  push:
    branches: [main]
  pull_request:

# ── uv 版本策略 ───────────────────────────────────────────────────────────────
# setup-uv 的 `version` 默认是空串 → 落到 "latest"，上游每次发版都会静默改变
# 我们的构建环境。这里钉死版本，升级 uv 变成一次显式的、需要看 CI 结果的改动。
env:
  UV_VERSION: "0.13.5"

jobs:
  # 文本文件编码检查：一个 job 十秒钟，挡掉一类排查成本极高的故障。
  # .gitignore 混入 GBK 字节会让 hatchling 在 uv sync 阶段崩掉，而报错只写
  # "build backend returned an error"——真实 traceback 埋在里层，本地又因
  # venv 已有 editable 安装而跳过构建、复现不出来。详见脚本内注释。
  encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python .github/scripts/check_encoding.py

  python:
    runs-on: ubuntu-latest
    needs: encoding
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      # 打印实际生效的版本：钉版本这件事必须能被验证，不能只靠配置写着就算
      - name: toolchain
        run: uv --version && python -V && uv python list --only-installed
      - run: bash ../../.github/scripts/annotate.sh "uv sync --frozen" uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      # pytest 也要包一层：它对失败只打印 traceback，step 级只剩 "exit code 1"。
      # ANNOTATE_GREP 换成 pytest 的失败摘要形状（FAILED / E   / short test summary）。
      - name: pytest
        env:
          ANNOTATE_GREP: '^(FAILED|ERROR) |^E   |^_{5,} .* _{5,}$|^=+ (FAILURES|ERRORS|short test summary)'
          ANNOTATE_TAIL: "60"
        run: bash ../../.github/scripts/annotate.sh "pytest" uv run pytest -q

  # 标准栈集成：health 必须报告 db/redis ok（§3.3）
  api-int:
    runs-on: ubuntu-latest
    needs: encoding
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: deaiify
          POSTGRES_PASSWORD: deaiify
          POSTGRES_DB: deaiify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deaiify -d deaiify"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DEAIIFY_DATABASE_URL: postgresql+asyncpg://deaiify:deaiify@127.0.0.1:5432/deaiify
      DEAIIFY_REDIS_URL: redis://127.0.0.1:6379/0
      DEAIIFY_EXPECT_SERVICES: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: toolchain
        run: uv --version && python -V
      - run: bash ../../.github/scripts/annotate.sh "uv sync --frozen" uv sync --frozen
      - name: pytest (标准栈)
        env:
          ANNOTATE_GREP: '^(FAILED|ERROR) |^E   |^_{5,} .* _{5,}$|^=+ (FAILURES|ERRORS|short test summary)'
          ANNOTATE_TAIL: "60"
        run: bash ../../.github/scripts/annotate.sh "pytest" uv run pytest -q

  # 环境漂移探针：用最新 uv 跑一次 uv sync --frozen。
  # 成功 → 提示可以升级 UV_VERSION；失败 → annotation 里带真实报错，且因为
  # continue-on-error 不会把主分支刷红。
  # 注意：本仓库的 token 无 admin 权限，/actions/jobs/{id}/logs 恒 403，
  # annotation 是唯一能读到报错的通道（见 .github/scripts/annotate.sh 的说明）。
  uv-latest-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: toolchain
        run: uv --version && python -V
      - run: bash ../../.github/scripts/annotate.sh "uv sync --frozen (latest uv)" uv sync --frozen

  web:
    runs-on: ubuntu-latest
    needs: encoding
    env:
      # e2e 起后端用的 lite 配置：SQLite + 进程内队列，不需要 PG/Redis 服务容器。
      # 限流必须放宽——默认 60 次/分钟，而 16 个用例每个都打 analyze，
      # 本地实测会撞成 429 导致"评分面板不出现"的假失败（真跑过 200×51/429×24）。
      DEAIIFY_REDIS_URL: ""
      DEAIIFY_DATABASE_URL: sqlite+aiosqlite:///./_e2e.db
      DEAIIFY_RATE_LIMIT_PER_MIN: "600"
      API_PROXY_TARGET: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      # tsc 依赖 Next 自动生成的 .next/types（LayoutProps/PageProps 等全局类型），
      # 这些文件被 gitignore 且只在 build 后出现——必须先 build 再 tsc，
      # 否则 CI 上会报 "Cannot find name 'LayoutProps'"（本地因跑过 build 而不复现）
      - run: pnpm --filter web build
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web test

      # ── e2e（docs §15 M3「Playwright 冒烟全过」）────────────────────────
      # 用 chrome channel 复用 runner 预装的 google-chrome，不下载 Playwright
      # 自带 Chromium（省 ~170MB 和一分钟）。
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: 启动 API（lite 模式）
        working-directory: apps/api
        run: |
          uv sync --frozen
          nohup uv run uvicorn deaiify.main:app --host 127.0.0.1 --port 8000 \
            >"$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && exit 0
            sleep 1
          done
          echo "API 未在 60s 内就绪，最后 50 行日志：" && tail -50 "$RUNNER_TEMP/api.log"
          exit 1
      - name: 启动 Web（生产构建）
        run: |
          nohup pnpm --filter web start --port 3000 >"$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          echo "Web 未在 60s 内就绪，最后 50 行日志：" && tail -50 "$RUNNER_TEMP/web.log"
          exit 1
      - name: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          ANNOTATE_GREP: '^\s+\d+\) |Error: |expect\(|Locator: |Expected: |Received: '
          ANNOTATE_TAIL: "80"
        run: bash .github/scripts/annotate.sh "playwright" pnpm --filter web exec playwright test
      # 失败时把服务日志也带出来（annotation 是唯一可读通道）
      - name: 失败时导出服务日志
        if: failure()
        run: |
          echo "::group::api.log"; tail -80 "$RUNNER_TEMP/api.log" || true; echo "::endgroup::"
          echo "::group::web.log"; tail -80 "$RUNNER_TEMP/web.log" || true; echo "::endgroup::"

  # 镜像构建见 .github/workflows/docker.yml
