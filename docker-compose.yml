# de-ai-ify 部署编排（docs §12.2）
#
# 两种用法：
#   1) 开发只用存储：  docker compose up -d db redis
#      （API/Web 留在宿主机热重载，见 docs §12.1）
#   2) 生产全栈：      docker compose --profile full up -d --build
#      （api + web + db + redis 一条命令）
#
# 端口刻意避开常见冲突：PG 5433、Redis 6380（§2.3 D）。
# api/web 默认只绑 127.0.0.1，需要对外时改 ports 并务必配置 DEAIIFY_API_KEY。

name: deaiify

services:
  # —— 存储（开发与生产都需要）——
  db:
    image: postgres:15-alpine
    container_name: deaiify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deaiify
      POSTGRES_PASSWORD: deaiify
      POSTGRES_DB: deaiify
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deaiify -d deaiify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: deaiify-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # —— 应用（profile: full）——
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        # 受限网络下把这两个指向镜像源可让构建从 40+ 分钟降到分钟级
        # 例：UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: deaiify-api
    restart: unless-stopped
    profiles: ["full"]
    environment:
      DEAIIFY_ENV: prod
      # 容器内走服务名；对外暴露的端口映射保持 127.0.0.1:8000
      DEAIIFY_DATABASE_URL: postgresql+asyncpg://deaiify:deaiify@db:5432/deaiify
      DEAIIFY_REDIS_URL: redis://redis:6379/0
      DEAIIFY_HOST: 0.0.0.0
      # —— 隐私（默认不保存原文）——
      DEAIIFY_STORE: ${DEAIIFY_STORE:-never}
      # —— 鉴权：对外暴露时务必设置 ——
      DEAIIFY_API_KEY: ${DEAIIFY_API_KEY:-}
      # —— 模型：可留空，改用 Web 的「模型设置」页配置 ——
      DEAIIFY_OPENAI_API_KEY: ${DEAIIFY_OPENAI_API_KEY:-}
      DEAIIFY_OPENAI_BASE_URL: ${DEAIIFY_OPENAI_BASE_URL:-}
      DEAIIFY_ANTHROPIC_API_KEY: ${DEAIIFY_ANTHROPIC_API_KEY:-}
      DEAIIFY_DEFAULT_MODEL: ${DEAIIFY_DEFAULT_MODEL:-}
      # 密钥加密主密钥：留空则容器内自动生成并落盘到 deaiify-data 卷
      # （重建容器仍可用；删除卷则旧 key 解不开）。多副本/迁移机器时务必显式设置。
      DEAIIFY_SECRET_KEY: ${DEAIIFY_SECRET_KEY:-}
      # 显式指定主密钥落点（Dockerfile 已设，这里写出便于覆盖与排障）
      DEAIIFY_SECRET_FILE: ${DEAIIFY_SECRET_FILE:-/app/data/.deaiify-secret}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 持久化自动生成的加密主密钥与 lite 模式数据
      - deaiify-data:/app/data

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # rewrites 目标在构建期固化进产物，必须在这里传（运行时 env 无效）
        API_PROXY_TARGET: http://api:8000
    container_name: deaiify-web
    restart: unless-stopped
    profiles: ["full"]
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  deaiify-data:
