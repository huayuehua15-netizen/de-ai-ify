[project]
name = "deaiify"
version = "0.1.0"
description = "去 AI 味：可解释的 AI 文本评分与改写引擎（de-ai-ify 后端 / CLI）"
license = "MIT"
requires-python = ">=3.13"
keywords = ["ai-text", "writing", "chinese", "nlp", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "fastapi>=0.143,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic-settings>=2.16,<3.0",
    "sqlalchemy[asyncio]>=2.1,<3.0",
    "aiosqlite>=0.21,<1.0",
    "asyncpg>=0.32,<1.0",
    "alembic>=1.20,<2.0",
    "httpx>=0.28,<1.0",
    "sse-starlette>=3.5,<4.0",
    "typer>=0.27,<1.0",
    "jieba>=0.42,<1.0",
    "orjson>=3.13,<4.0",
    "tenacity>=9.2,<10.0",
    "redis>=8.1,<9.0",
    "openai>=3.31,<4.0",
    "anthropic>=1.14,<2.0",
    "cryptography>=43,<47",
]

[project.urls]
Homepage = "https://github.com/huayuehua15-netizen/de-ai-ify"
Repository = "https://github.com/huayuehua15-netizen/de-ai-ify"
Issues = "https://github.com/huayuehua15-netizen/de-ai-ify/issues"

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "respx>=0.23,<1.0",
    "httpx2>=2.12,<3.0",
    "ruff>=0.17,<1.0",
]

[project.scripts]
deaiify = "deaiify.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deaiify"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() 出现在参数默认值是 FastAPI 的标准依赖注入写法
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
